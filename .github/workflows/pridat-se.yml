name: Přihláška → PR

on:
  issues:
    types: [opened, edited]
  push:
    branches: [main]
    paths: [data.json]
  workflow_dispatch:
    inputs:
      issue:
        description: Číslo issue s přihláškou (znovu vytvoří PR z aktuálního main)
        required: true

permissions: {}

concurrency:
  group: pridat-se-${{ github.event.issue.number || inputs.issue || 'push' }}
  cancel-in-progress: true

jobs:
  # After a merge, rebuild every other open application from fresh main so their PRs don't conflict on data.json.
  rebuild-open:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          # Spaced out so the re-runs respect Nominatim's 1 request/second limit.
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --label prihlaska --state open --limit 30 --json number --jq '.[].number'); do
            gh workflow run pridat-se.yml -R "$GITHUB_REPOSITORY" -f issue="$n"
            sleep 3
          done

  pr:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'prihlaska'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Načíst přihlášku
        run: |
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "Neplatné číslo issue"; exit 1; }
          gh issue view "$ISSUE" --json labels --jq '.labels[].name' | grep -qx prihlaska || { echo "Issue nemá štítek prihlaska"; exit 1; }
          gh issue view "$ISSUE" --json body --jq .body > issue-body.md
      - name: Zpracovat přihlášku
        id: build
        run: ISSUE_BODY="$(cat issue-body.md)" node scripts/issue-to-entry.mjs "$ISSUE"
      - name: Napsat chybu do issue
        if: failure() && steps.build.outcome == 'failure'
        run: gh issue comment "$ISSUE" --body-file error.md
      - name: Vytvořit nebo aktualizovat PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="pridat-se/$ISSUE"
          git checkout -B "$branch"
          git add data.json
          if git diff --cached --quiet; then echo "Beze změny"; exit 0; fi
          git commit -m "Přidat ajťáka z #$ISSUE"
          git push --force origin "$branch"
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --body-file pr-body.md
          else
            gh pr create --head "$branch" --base main --title "Přidat ajťáka z #$ISSUE" --body-file pr-body.md
          fi
