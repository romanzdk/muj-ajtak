name: Přihláška → PR

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: Číslo issue s přihláškou (znovu vytvoří PR z aktuálního main)
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pridat-se-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: true

jobs:
  pr:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'prihlaska')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Načíst přihlášku
        run: gh issue view "$ISSUE" --json body --jq .body > issue-body.md
      - name: Zpracovat přihlášku
        id: build
        run: ISSUE_BODY="$(cat issue-body.md)" node scripts/issue-to-entry.mjs "$ISSUE"
      - name: Napsat chybu do issue
        if: failure() && steps.build.outcome == 'failure'
        run: gh issue comment "$ISSUE" --body-file error.md
      - name: Vytvořit nebo aktualizovat PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="pridat-se/$ISSUE"
          git checkout -B "$branch"
          git add data.json
          git commit -m "Přidat ajťáka z #$ISSUE"
          git push --force origin "$branch"
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --body-file pr-body.md
          else
            gh pr create --head "$branch" --base main --title "Přidat ajťáka z #$ISSUE" --body-file pr-body.md
          fi
